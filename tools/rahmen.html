<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Repo images: tall 1080x1920 store-style shots and the 1280x640 social preview. Rendered by tools/bilder.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--ink:#11131A;--blue:#8E99FF;--paper:#ECEDF2;--muted:#9A9EAB;--red:#FF6B6B;--orange:#FFB04D}
*{margin:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{background:radial-gradient(110% 70% at 50% 0%,#232A5C 0%,var(--ink) 62%);color:var(--paper);font-family:Inter,sans-serif}
.tall{display:flex;flex-direction:column;align-items:center;padding-top:140px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:100px;line-height:1.02;letter-spacing:-.03em;text-align:center;max-width:960px}
.sub{margin-top:30px;font-size:38px;color:var(--blue)}
.phone{margin-top:90px;width:800px;padding:22px 22px 0;border-radius:72px 72px 0 0;background:#08090d;box-shadow:0 0 0 3px #2b3050,0 40px 120px rgba(0,0,0,.55)}
.phone img{display:block;width:100%;border-radius:52px 52px 0 0}
.wide{display:grid;grid-template-columns:1fr 430px;grid-template-rows:640px;gap:40px;height:100%;padding:0 70px 0 84px;align-items:center}
.brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:500;letter-spacing:-.02em}.brand b{color:var(--blue);font-weight:500}
.logo{width:46px;height:46px;border-radius:12px;background:#4352E0;display:grid;grid-template-columns:repeat(3,10px);gap:3px;place-content:center}
.logo i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.35)}.logo i.on{background:#fff}
.wide h1{text-align:left;font-size:62px;max-width:none;margin-top:24px}
.wide .sub{font-size:25px;margin-top:24px}
.chips{display:flex;gap:10px;margin-top:26px}.chips span{font-size:19px;font-weight:500;padding:6px 12px;border-radius:8px}
.small{margin-top:30px;font-size:21px;color:var(--muted)}
.wide .phone{width:430px;margin-top:90px;padding:14px 14px 0;border-radius:48px 48px 0 0;align-self:start}
.wide .phone img{border-radius:36px 36px 0 0}
</style></head><body><script>
const q=new URLSearchParams(location.search);
document.documentElement.style.setProperty("--w",q.get("w")+"px");document.documentElement.style.setProperty("--h",q.get("h")+"px");
const t=q.get("t").replace("|","<br>");
const logo='<span class="logo">'+[0,0,0,0,1,0,0,0,0].map(o=>`<i class="${o?"on":""}"></i>`).join("")+'</span>';
document.body.innerHTML = q.get("art")==="wide"
 ? `<div class="wide"><div><div class="brand">${logo}<span>Stunden<b>blick</b></span></div><h1>${t}</h1><div class="sub">${q.get("s")}</div>
    <div class="chips"><span style="background:rgba(255,107,107,.16);color:var(--red)">Entfall</span><span style="background:rgba(255,176,77,.16);color:var(--orange)">Vertretung</span><span style="background:rgba(255,176,77,.16);color:var(--orange)">Raumänderung</span><span style="background:rgba(142,153,255,.16);color:var(--blue)">Klausur</span></div>
    <div class="small">github.com/BrickyStudios/stundenblick</div></div><div class="phone"><img src="${q.get("img")}"></div></div>`
 : `<div class="tall"><h1>${t}</h1><div class="sub">${q.get("s")}</div><div class="phone"><img src="${q.get("img")}"></div></div>`;
</script></body></html>
